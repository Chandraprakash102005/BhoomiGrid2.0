services:
  db:
    build:
      context: ./database
    image: bhoomigrid-postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bhoomigrid}
      POSTGRES_USER: ${POSTGRES_USER:-bhoomi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhoomi_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bhoomi}:${POSTGRES_PASSWORD:-bhoomi_dev_password}@db:5432/${POSTGRES_DB:-bhoomigrid}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
